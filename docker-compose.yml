services:
  desktop:
    image: ${DOCKER_USERNAME:-storytellerf}/desktop-in-docker:${IMAGE_TAG:-snapshot}
    ports:
      - "6080"
      - "5901"
      - "3000"
      - "3001"
    environment:
      - VNC_GEOMETRY=1920x1080
      - VNC_DEPTH=24
    env_file:
      - .env
    volumes:
      - ./logs:${CONTAINER_HOME:-/home/user}/log/supervisor
      - bash_history:${CONTAINER_HOME:-/home/user}/.desktop-in-docker/.bash_history
      - firefox_cache:${CONTAINER_HOME:-/home/user}/.cache/mozilla/firefox
      - firefox_config:${CONTAINER_HOME:-/home/user}/.mozilla/firefox
    shm_size: '2gb' # Allocate more shared memory
    restart: "unless-stopped"

volumes:
  avd_data:
  sdk_data:
    external: true
  bash_history:
  firefox_cache:
  firefox_config:
